name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: false

permissions:
  contents: write

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

jobs:
  # ── Build PyInstaller sidecar binary per platform ───────────────
  build-sidecar:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            python: "3.12"
          - os: macos-latest
            target: aarch64-apple-darwin
            python: "3.12"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            python: "3.12"

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build sidecar binary
        shell: bash
        run: |
          pyinstaller vigil-api.spec --noconfirm

          # Determine extension
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            SOURCE="dist/vigil-api.exe"
            DEST="vigil-api-${{ matrix.target }}.exe"
          else
            SOURCE="dist/vigil-api"
            DEST="vigil-api-${{ matrix.target }}"
          fi

          # Validate the binary
          if [[ "${{ matrix.os }}" != "windows-latest" ]]; then
            chmod +x "$SOURCE"
          fi

          echo "Built sidecar: $(ls -lh "$SOURCE" 2>/dev/null || echo "$SOURCE")"
          mv "$SOURCE" "$DEST"

      - name: Upload sidecar
        uses: actions/upload-artifact@v4
        with:
          name: sidecar-${{ matrix.target }}
          path: vigil-api-${{ matrix.target }}*
          retention-days: 1

  # ── Build Tauri app per platform ────────────────────────────────
  build-app:
    needs: build-sidecar
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust_target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install Tauri CLI
        run: npm install -D @tauri-apps/cli@latest

      - name: Install frontend dependencies
        run: npm install

      - name: Download sidecar binary
        uses: actions/download-artifact@v4
        with:
          name: sidecar-${{ matrix.target }}
          path: src-tauri/binaries/

      - name: Ensure sidecar is executable
        if: matrix.os != 'windows-latest'
        run: chmod +x src-tauri/binaries/vigil-api-${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev libayatana-appindicator3-dev

      - name: Build Tauri app
        run: npx tauri build
        env:
          TAURI_ENV_TARGET_TRIPLE: ${{ matrix.rust_target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.target }}
          path: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app.tar.gz
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
          retention-days: 7

  # ── Create GitHub Release ───────────────────────────────────────
  release:
    needs: build-app
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: app-*
          merge-multiple: true
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/**/*.dmg
            artifacts/**/*.app.tar.gz
            artifacts/**/*.msi
            artifacts/**/*.exe
